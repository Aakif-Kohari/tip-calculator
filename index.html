<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tip calculator</title>
  <meta name="description" content="Work out the tip and split the bill. No sign-up, no dependencies.">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('tip-theme'); } catch (e) {}
      if (!theme) {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="top">
      <h1>Tip calculator</h1>
      <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false">
        <span class="theme-toggle__track" aria-hidden="true"><span class="theme-toggle__thumb"></span></span>
        <span id="themeLabel">Dark mode</span>
      </button>
    </header>

    <main class="layout">
      <section class="inputs" aria-labelledby="inputsTitle">
        <h2 id="inputsTitle" class="visually-hidden">Bill details</h2>

        <div class="field">
          <label for="bill">Bill amount</label>
          <div class="money">
            <select id="currency" aria-label="Currency">
              <option value="INR" selected>₹ INR</option>
              <option value="USD">$ USD</option>
              <option value="EUR">€ EUR</option>
              <option value="GBP">£ GBP</option>
            </select>
            <input id="bill" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" autocomplete="off">
          </div>
          <p class="error" id="billError" role="alert" hidden></p>
        </div>

        <fieldset class="field tips">
          <legend>Tip</legend>
          <div class="tip-row">
            <input type="radio" name="tip" id="tip5" value="5">
            <label for="tip5">5%</label>
            <input type="radio" name="tip" id="tip10" value="10" checked>
            <label for="tip10">10%</label>
            <input type="radio" name="tip" id="tip15" value="15">
            <label for="tip15">15%</label>
            <input type="radio" name="tip" id="tip20" value="20">
            <label for="tip20">20%</label>
            <div class="custom">
              <label for="customTip" class="visually-hidden">Custom tip percent</label>
              <input id="customTip" type="number" inputmode="decimal" min="0" max="100" step="0.5" placeholder="Custom %">
            </div>
          </div>
          <p class="error" id="tipError" role="alert" hidden></p>
        </fieldset>

        <div class="field">
          <label for="people">People splitting</label>
          <div class="stepper">
            <button type="button" id="peopleDown" aria-label="One fewer person">−</button>
            <input id="people" type="number" inputmode="numeric" min="1" max="50" step="1" value="1">
            <button type="button" id="peopleUp" aria-label="One more person">+</button>
          </div>
          <p class="error" id="peopleError" role="alert" hidden></p>
        </div>

        <label class="check">
          <input type="checkbox" id="roundUp">
          <span>Round each share up to a whole amount</span>
        </label>

        <button type="button" class="reset" id="reset">Clear</button>
      </section>

      <section class="receipt" aria-labelledby="receiptTitle">
        <h2 id="receiptTitle">Your check</h2>

        <dl class="lines">
          <div class="line">
            <dt>Bill</dt>
            <dd id="outBill">—</dd>
          </div>
          <div class="line">
            <dt id="tipLabel">Tip</dt>
            <dd id="outTip">—</dd>
          </div>
          <div class="line line--total">
            <dt>Total</dt>
            <dd id="outTotal">—</dd>
          </div>
        </dl>

        <div class="each" aria-live="polite" aria-atomic="true">
          <p class="each__label" id="eachLabel">Enter a bill to see the split</p>
          <p class="each__value" id="outEach">—</p>
          <p class="each__note" id="outNote"></p>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
